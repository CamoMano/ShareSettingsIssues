name: Feature request
description: Suggest new functionality or an improvement to an existing feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem you're trying to
        solve — requests focused on a use case are easier to act on than
        a specific implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the site currently makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Your proposed solution, in as much detail as you like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Optional. Other ways to solve this, or workarounds you use today.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Browsing / discovering reports (search, filters, sorting)
        - Submitting / editing reports
        - Viewing reports (rendering, benchmark screenshots, config links)
        - Comments
        - Ratings
        - Games catalog
        - Hardware profiles (device specs, autofill)
        - Accounts / profiles
        - Notifications
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Which device category does this matter for?
      options:
        - Handhelds (Steam Deck, ROG Ally/X, Legion Go, MSI Claw, ...)
        - Desktops
        - Laptops
        - All devices
        - Not device-specific
    validations:
      required: true
